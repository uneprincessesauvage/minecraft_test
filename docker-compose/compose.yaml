services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft
    restart: unless-stopped
    #pull_policy: always
    tty: true
    stdin_open: true

    ports:
      - "25566:25565/tcp"
      - "25567:25575/tcp"
      - "8090:8090/tcp"
      - "8095:8095/tcp"
      - "8100:8100"
      - "8517:8517"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.2"
      MEMORY: "8G"

      ONLINE_MODE: "FALSE"
      MOTD: "Serveur Minecraft de Test docker"
      MAX_PLAYERS: "5"


    volumes:
      - /data/services/srv_test_minecraft:/data
